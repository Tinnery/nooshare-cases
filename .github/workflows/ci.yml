name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
    
    - name: Install Python dependencies
      run: |
        uv sync --extra dev
    
    - name: Run Python tests
      run: |
        uv run pytest tests/ -v
    
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    
    - name: Install frontend dependencies
      run: |
        cd web
        bun install
    
    - name: Build frontend
      run: |
        cd web
        bun run build
