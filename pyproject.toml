[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nooshare-cases"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "asyncpg>=0.30.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
nooshare-cases = "nooshare_cases.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
